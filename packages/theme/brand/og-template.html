<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Turboslide Open Graph card</title>
    <!--
  The site wide Open Graph image (gslides-parity SPEC-4 1.7; docs/NEXT.md 4.1.3 item 4), 1200 by
  630, rendered in Chromium at device scale factor 1 by scripts/build-brand.ts into
  apps/studio/public/og/turboslide.png. The Blue Marble (/brand/mood-earth-dark.jpg, Public domain (PD-USGov-NASA); attribution not required)
  at object-fit cover behind; the paper plate lower right, 56 px from the right
  and the bottom edges and 528 px wide, carrying the lockup (the mark at the word's
  48 px cap, the word in live Inter 500), the lead's first sentence, the address and the credit.
  Nothing that matters sits within 48 px of an edge (X crops 1.91:1 to 2:1). Generated; edit the
  template function in scripts/build-brand.ts.
-->
    <link rel="stylesheet" href="../../fonts/src/inter.css" />
    <link rel="stylesheet" href="../../chrome/src/tokens.css" />
    <link rel="stylesheet" href="../../chrome/src/brand.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--pt-paper);
        color: var(--pt-ink);
        font-family: var(--pt-display);
        font-feature-settings: 'cv11', 'ss01';
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .plate {
        position: absolute;
        right: 56px;
        bottom: 56px;
        width: 528px;
        box-sizing: border-box;
        background: var(--ts-plate);
        padding: 32px 36px 28px;
      }
      .lock {
        display: block;
      }
      .lock svg {
        display: block;
      }
      .plate p {
        margin: 20px 0 0;
        font-family: var(--pt-text);
        font-size: 22px;
        line-height: 1.4;
        color: var(--pt-ink);
      }
      .url {
        margin: 12px 0 0;
        font-family: var(--pt-text);
        font-size: 20px;
        line-height: 1.4;
        color: var(--pt-ink-2);
      }
      .credit {
        margin: 16px 0 0;
        font-family: var(--pt-text);
        font-size: 15px;
        line-height: 1.45;
        letter-spacing: 0.01em;
        color: var(--pt-titanium);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="../../../apps/studio/public/brand/mood-earth-dark.jpg" alt="" />
      <div class="plate">
        <div class="lock">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 381 66"
            width="381"
            height="66"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M17.03 3L70.63 3L68.08 15L14.48 15ZM37.03 3L50.63 3L45.96 25L32.36 25ZM31.72 28L45.32 28L40.43 51L26.83 51ZM8.23 3L17.83 3L15.28 15L5.68 15ZM3.23 19L28.83 19L27.56 25L1.96 25ZM1.32 28L26.92 28L25.64 34L0.04 34ZM6.98 39L24.58 39L22.03 51L4.43 51Z"
            />
            <text
              x="93.05"
              y="51"
              font-family="Inter, 'Inter Fallback', system-ui, sans-serif"
              font-size="66"
              font-weight="500"
              letter-spacing="-1.65"
              style="font-feature-settings: 'cv11', 'ss01'"
            >
              Turboslide
            </text>
          </svg>
        </div>
        <p>Turboslide is a slides editor in the browser.</p>
        <div class="url">www.turboslide.com</div>
        <div class="credit">Image: NASA, Reto Stöckli, 2007, public domain</div>
      </div>
    </div>
  </body>
</html>
