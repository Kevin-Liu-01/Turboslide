# Workspace layout (SPEC 3.1). packages/native/npm/* are the per-platform addon packages
# @turboslide/native depends on optionally (M5; docs/native.md).
packages:
  - apps/*
  - packages/*
  - packages/native/npm/*
  - tooling/*

# The default catalog pins every shared dependency to one exact version (SPEC 3.2).
# Packages reference these with "catalog:". Never pin "latest"; a version bump goes
# through a PR that runs the full acceptance suite.
catalog:
  '@codemirror/autocomplete': 6.20.3
  '@codemirror/commands': 6.11.0
  '@codemirror/lang-json': 6.0.2
  '@codemirror/language': 6.12.4
  '@codemirror/lint': 6.9.7
  '@codemirror/state': 6.7.4
  '@codemirror/view': 6.43.11
  '@lezer/highlight': 1.2.3
  '@modelcontextprotocol/sdk': 1.30.0
  '@paper-design/shaders': 0.0.78
  '@playwright/test': 1.62.1
  '@simplewebauthn/browser': 14.0.0
  '@simplewebauthn/server': 14.0.1
  # chrome-headless-shell 147 for Linux x64 functions (docs/hosting-chromium.md); optional in @turboslide/headless
  '@sparticuz/chromium': 147.0.2
  '@tanstack/devtools-vite': 0.8.5
  '@tanstack/eslint-config': 0.4.0
  '@tanstack/react-devtools': 0.10.12
  '@tanstack/react-router': 1.170.33
  '@tanstack/react-router-devtools': 1.167.1
  '@tanstack/react-start': 1.168.50
  '@tanstack/router-cli': 1.167.34
  '@testing-library/dom': 10.4.1
  '@testing-library/react': 16.3.3
  '@types/jsdom': 30.0.0
  '@types/node': 24.13.4
  '@types/pg': 8.23.1
  '@types/pngjs': 6.0.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@upstash/ratelimit': 2.0.8
  '@upstash/redis': 1.38.4
  '@vercel/blob': 2.8.0
  '@vitejs/plugin-react': 6.1.1
  better-auth: 1.7.4
  dompurify: 3.4.15
  eslint: 10.10.0
  ioredis: 6.0.0
  jsdom: 30.0.1
  jszip: 3.10.2
  kysely: 0.29.5
  nitro: 3.0.260903-beta
  parse5: 8.0.1
  pg: 8.23.0
  pixelmatch: 7.2.0
