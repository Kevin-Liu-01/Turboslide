# Workspace layout (SPEC 3.1). packages/native/npm/* are the per-platform addon packages
# @turboslide/native depends on optionally (M5; docs/native.md).
packages:
  - apps/*
  - packages/*
  - packages/native/npm/*
  - tooling/*

# The default catalog pins every shared dependency to one exact version (SPEC 3.2).
# Packages reference these with "catalog:". Never pin "latest"; a version bump goes
# through a PR that runs the full acceptance suite.
catalog:
  # The Cloudflare move (docs/CLOUDFLARE.md 3.6.2; the integrator's seam commit, 2026-10-01): the
  # realtime Worker's tooling, each the registry's latest on 2026-10-01; the vitest plugin requires
  # vitest 4.1 or later and pins its own wrangler, so the two move together
  '@cloudflare/vitest-plugin': 1.3.5
  '@cloudflare/workers-types': 5.20261001.1
  '@codemirror/autocomplete': 6.20.3
  '@codemirror/commands': 6.11.1
  '@codemirror/lang-json': 6.0.2
  '@codemirror/language': 6.12.4
  '@codemirror/lint': 6.9.7
  '@codemirror/state': 6.7.4
  '@codemirror/view': 6.43.11
  # The design round (docs/DESIGN.md 2.4, decision C3): placement of every floating plate in the
  # editor and the pages through one shared place() (packages/chrome/src/place.ts), 7,057 B gzip
  '@floating-ui/dom': 1.8.0
  '@lezer/highlight': 1.2.3
  '@modelcontextprotocol/sdk': 1.31.0
  '@paper-design/shaders': 0.0.78
  '@playwright/test': 1.62.1
  # chrome-headless-shell 147 for Linux x64 functions (docs/hosting-chromium.md); optional in @turboslide/headless
  '@sparticuz/chromium': 147.0.2
  '@tanstack/devtools-vite': 0.8.5
  '@tanstack/eslint-config': 0.4.0
  '@tanstack/react-devtools': 0.10.12
  '@tanstack/react-router': 1.170.41
  '@tanstack/react-router-devtools': 1.167.1
  '@tanstack/react-start': 1.168.60
  '@tanstack/router-cli': 1.167.34
  '@testing-library/dom': 10.4.1
  '@testing-library/react': 16.3.3
  '@types/jsdom': 30.0.0
  '@types/node': 24.13.4
  '@types/pngjs': 6.0.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vercel/blob': 2.8.0
  # gslides-parity SPEC-4 0.31: waitUntil for the thumbnail refresh and the retention prune (the
  # integrator, round four day 0); SPEC-4 names no version, so the newest release on the registry
  # on 2026-09-14 is pinned (3.9.7, published 2026-09-09; build-4/integrator.md section 5)
  '@vercel/functions': 3.9.7
  '@vitejs/plugin-react': 6.1.1
  better-auth: 1.7.4
  # The design round (docs/DESIGN.md 5.1, decision C10): the chrome's colour tokens generated in
  # OKLCH and solved to their WCAG 2.2 floors at build time and in tests (scripts/build-colors.ts);
  # a devDependency, 0 B on any page
  colorjs.io: 0.7.1
  dompurify: 3.4.16
  eslint: 10.10.0
  # Polish two (docs/POLISH-2.md 5.1, decision C22): /docs in apps/studio, headless. fumadocs-core
  # gives the loader, the page tree, the table of contents and the markdown twins; fumadocs-mdx
  # compiles the MDX at build through its Vite plugin. No fumadocs-ui, Tailwind or Pagefind.
  # Pinned exactly: fumadocs-core shipped 29 releases between 2026-07-27 and 2026-10-05
  fumadocs-core: 16.16.2
  fumadocs-mdx: 15.4.6
  jsdom: 30.0.1
  jszip: 3.10.2
  # The hardening round (docs/hardening/HARDENING.md HR-C#3a, CLEANUP-9): unused files, exports,
  # dependencies and duplicate exports, read with the committed knip.json by `node scripts/check.mjs
  # --knip` against scripts/knip-allow.json; the version the cleanup research measured
  knip: 6.40.0
  kysely: 0.29.5
  nitro: 3.0.260903-beta
  parse5: 8.0.1
  pixelmatch: 7.2.0
  playwright-core: 1.62.1
  pngjs: 7.0.0
  pptxgenjs: 4.0.1
  prettier: 3.9.6
  react: 19.3.0
  react-dom: 19.3.0
  resend: 6.28.0
  sharp: 0.35.5
  tsdown: 0.23.0
  turbo: 2.10.12
  typescript: 6.0.3
  ulid: 3.0.2
  vite: 8.2.2
  vitest: 4.1.11
  wrangler: 4.146.0
  zod: 4.6.1

# Round three (gslides-parity SPEC-3 8.10, 11.5 R0; build-3/b4.md request 1): pptxgenjs 4.0.1
# declares image-size ^1.2.1 but its Node path requires the module name 'sizeof', which does not
# exist, so image-size is never loaded; no published image-size release fixes GHSA-w3rx-r6r6-pgpr
# and GHSA-5p2g-fcmc-qvqq (2.0.2 is the latest and still vulnerable). The inert dependency is
# removed from the graph instead of an allowlist entry. Drop this when pptxgenjs stops declaring it.
overrides:
  'pptxgenjs>image-size': '-'
  # The hardening round (docs/hardening/HARDENING.md 4.5, HR-W#1d; WEB-2): the patched release of
  # five packages that only reach the tree through another package, each inside the range its
  # dependent declares. proxy-addr (GHSA-jqcg-44mw-7w3h, critical) and ip-address (GHSA-j6r3-76f7-8jcv,
  # GHSA-h3mg-xc3c-68pw) through the MCP SDK's express; fast-uri (GHSA-hrr3-gc8f-f4qj) through its
  # ajv; source-map-js (GHSA-68fv-2mgg-jv7q) through postcss and jsdom; brace-expansion
  # (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr) through eslint's minimatch.
  # Drop an entry once its dependents resolve the patched release on their own.
  'proxy-addr@<2.0.8': 2.0.8
  'ip-address@<10.7.1': 10.7.3
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'source-map-js@<1.2.2': 1.2.2
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  # HR-W#1e (WEB-2): seroval 1.5.6 (GHSA-p6vx-979v-rg4c critical, GHSA-jp82-f5mq-hwhp) comes with
  # solid-js 1.9.15, which the devtools pull in and better-auth resolves as its optional peer, so
  # moving the devtools to devDependencies alone leaves it in the production graph. solid-js 1.9.16
  # is the first release on seroval ~1.6.8; the TanStack Start serializer is on seroval 1.6.7.
  'solid-js@<1.9.16': 1.9.16

# The Glyphfield port (wave 1.1): Paper Shaders 0.0.78's ShaderMount pools two disposed WebGL
# contexts with their compiled programs, keyed by the context attributes, and its dispose no longer
# calls getError. The patch is Glyphfield's (MIT, Kevin Liu) with one Turboslide change: a pooled
# canvas is set to size zero, so it holds no drawing buffer and the next mount, at speed 0 too,
# draws on its first resize. It changes only dist/shader-mount.js; THIRD_PARTY_NOTICES.md and
# packages/materials/NOTICE carry the Apache-2.0 change notice. A Paper upgrade must carry the
# patch forward or drop it.
patchedDependencies:
  '@paper-design/shaders@0.0.78': patches/@paper-design__shaders@0.0.78.patch

# pnpm 11 refuses to run dependency build scripts it has not been told about
# (strictDepBuilds; https://pnpm.io/settings/build). The old pnpm.onlyBuiltDependencies
# block is ignored, so the approved list is committed here (tanstack report section 2).
allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  sharp: true
  # the realtime Worker's runtime (the Cloudflare move, 2026-10-01): workerd's postinstall checks the
  # platform binary of its optional dependency and downloads it when absent, esbuild's shape
  workerd: true

# pnpm 11 holds back releases younger than its default minimumReleaseAge; pnpm appended this
# exclusion for the pinned zod on the first install. Keep entries here only for pinned catalog versions.
minimumReleaseAgeExclude:
  - zod@4.6.1
  - '@cloudflare/vitest-plugin@1.3.5'
  - '@cloudflare/workerd-darwin-64@1.20261001.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261001.1'
  - '@cloudflare/workerd-linux-64@1.20261001.1'
  - '@cloudflare/workerd-linux-arm64@1.20261001.1'
  - '@cloudflare/workerd-windows-64@1.20261001.1'
  - '@cloudflare/workers-types@5.20261001.1'
  - miniflare@5.20261001.0-alpha
  - workerd@1.20261001.1
  - wrangler@4.146.0
