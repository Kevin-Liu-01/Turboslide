# Round three (gslides-parity SPEC-3 8.10, 11.5 R0; build-3/b4.md request 1): pptxgenjs 4.0.1
# declares image-size ^1.2.1 but its Node path requires the module name 'sizeof', which does not
# exist, so image-size is never loaded; no published image-size release fixes GHSA-w3rx-r6r6-pgpr
# and GHSA-5p2g-fcmc-qvqq (2.0.2 is the latest and still vulnerable). The inert dependency is
# removed from the graph instead of an allowlist entry. Drop this when pptxgenjs stops declaring it.
overrides:
  'pptxgenjs>image-size': '-'

# pnpm 11 refuses to run dependency build scripts it has not been told about
# (strictDepBuilds; https://pnpm.io/settings/build). The old pnpm.onlyBuiltDependencies
# block is ignored, so the approved list is committed here (tanstack report section 2).
allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  sharp: true

# pnpm 11 holds back releases younger than its default minimumReleaseAge; pnpm appended this
# exclusion for the pinned zod on the first install. Keep entries here only for pinned catalog versions.
minimumReleaseAgeExclude:
  - zod@4.6.1
