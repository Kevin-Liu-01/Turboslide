<title>Turboslide Open Graph card</title>
<!--
  The site wide Open Graph image, 1200 by 630, rendered in Chromium at device scale factor 1 the
  way research-4 report 02 section 6.4 asks (the product's own raster path, the product's Inter).
  The composition is the mark at card size: the picture is the liquid metal frame through the
  screen at 10 px cells (assets/og-screen-dark.png, 120 by 63 cells, so a 552 px feed card still
  shows 4.6 px cells); the plate is cut from it at the mark's proportions (left 12.5 percent,
  width 50 percent, bottom 12.5 percent, height 37.5 percent) and carries the lockup and one
  sentence. Nothing that matters sits within 48 px of an edge (X crops 1.91:1 to 2:1).
-->

.card { position: relative; width: 1200px; height: 630px; background: url('assets/og-screen-dark.png') 0 0 no-repeat; background-size: 1200px 630px; image-rendering: pixelated; }
.plate { position: absolute; left: 150px; bottom: 79px; width: 600px; height: 236px; background: var(--pt-paper); padding: 30px 32px 0; }
.lock { display: flex; align-items: center; gap: 20px; }
.lock svg { width: 48px; height: 48px; fill: currentColor; display: block; }
.lock b { font-weight: 500; font-size: 66px; line-height: 1; letter-spacing: -0.025em; }
.plate p { margin: 24px 0 0; font-family: var(--pt-text); font-size: 22px; line-height: 1.4; color: var(--pt-ink-2); max-width: 536px; }
.url { position: absolute; left: 150px; top: 60px; font-size: 20px; color: var(--pt-ink); background: var(--pt-paper); padding: 6px 12px; }
