<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Turboslide">
  <!-- The 16 px drawing on the pixel grid: frame 14 by 8 at 1 px, crossbar and stem 2 px, both panels
       paper; no cells (a 2 px cell at 16 px leaves a 5 by 5 field, research-4 report 02 section 5.4). Rendered at
       2 px per unit this is the 32 px tab icon; the ICO's 32 and 48 px entries add 2 px cells to the right panel. -->
  <g fill="currentColor">
    <rect x="1" y="4" width="14" height="2"/>
    <rect x="1" y="6" width="1" height="6"/>
    <rect x="14" y="6" width="1" height="6"/>
    <rect x="1" y="11" width="14" height="1"/>
    <rect x="7" y="6" width="2" height="5"/>
  </g>
</svg>
